<!doctype html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color:#232724; background:#f7f5f0; }
    * { box-sizing:border-box; }
    [hidden] { display:none!important; }
    body { margin:0; min-height:100vh; }
    button,input,textarea { font:inherit; }
    button { cursor:pointer; border:1px solid #dedbd2; background:#fffefa; color:#25312c; border-radius:8px; padding:9px 13px; min-height:40px; font-weight:650; }
    button:disabled { opacity:.55; cursor:not-allowed; }
    button.active,button.primary { color:white; background:#1c7ea9; border-color:#1c7ea9; }
    button.quiet { border:0; background:transparent; color:#276e6a; padding:5px 8px; min-height:30px; }
    a { color:#276e6a; }
    header { display:flex; justify-content:space-between; align-items:center; gap:10px; min-height:48px; padding:6px 18px; background:#fffefa; border-bottom:1px solid #e2ded5; }
    .brandline,.header-links { display:flex; align-items:center; gap:8px; min-width:0; }
    .header-links { flex:none; }
    .header-links button,.header-links a { font-size:12px; min-height:30px; padding:5px 7px; text-decoration:none; white-space:nowrap; }
    .brand { color:#a9471c; font-size:23px; font-weight:750; line-height:1.15; white-space:nowrap; }
    .sub { color:#67706b; font-size:13px; white-space:nowrap; }
    .brand-divider { width:1px; height:24px; background:#d8d4ca; }
    main { max-width:1080px; margin:12px auto; padding:0 14px 40px; }
    .panel { background:#fffefa; border:1px solid #e1ddd4; border-radius:10px; box-shadow:0 10px 30px #2327240a; margin-bottom:12px; }
    .inside { padding:14px; }
    h2 { font-size:16px; margin:0 0 12px; }
    textarea { width:100%; min-height:215px; resize:vertical; padding:13px; border:1px solid #d9d5cb; border-radius:8px; background:#fff; line-height:1.5; }
    #catchInput { height:430px; }
    input[type=text],input[type=date] { width:100%; min-height:40px; padding:8px; border:1px solid #d9d5cb; border-radius:7px; background:#fff; }
    .actions,.row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .actions { justify-content:space-between; align-items:flex-start; margin-top:9px; }
    .clear-stack { display:flex; flex-direction:column; align-items:center; gap:14px; }
    .entry-count { --counter-fg:#7d3519; --counter-dot:#a9471c; display:inline-flex; align-items:center; gap:4px; padding:0 3px; color:var(--counter-fg); font-size:10px; font-weight:750; line-height:1; white-space:nowrap; transition:color .2s; }
    .entry-count::before { content:""; width:5px; height:5px; border-radius:50%; background:var(--counter-dot); }
    .entry-count.tone-1 { --counter-fg:#155c7a; --counter-dot:#1c7ea9; }
    .entry-count.tone-2 { --counter-fg:#604093; --counter-dot:#8b5cf6; }
    .entry-count.tone-3 { --counter-fg:#366b47; --counter-dot:#65a56f; }
    .entry-count.tone-4 { --counter-fg:#87364e; --counter-dot:#c75b7a; }
    .entry-count.tone-5 { --counter-fg:#35436c; --counter-dot:#5b6fb2; }
    .dump-actions { display:flex; gap:10px; margin-left:auto; }
    .dump-actions button { width:100px; min-height:38px; padding:5px 6px; border-radius:18px; font-size:16px; box-shadow:0 3px 7px #163f522e; }
    #clearCatch { border-radius:18px; }
    .status { color:#5c6a63; min-height:22px; margin-top:10px; font-size:13px; }
    .status:empty { display:none; }
    .status.error { color:#923a31; font-weight:650; }
    .item { padding:12px; border:1px solid #e0ddd4; border-radius:8px; background:#fff; }
    .response-actions { display:flex; align-items:center; gap:8px; margin-top:12px; }
    #saveResponse { min-height:34px; padding:6px 12px; border-radius:18px; }
    .response-save-status { color:#5c6a63; font-size:12px; }
    .response-save-status.error { color:#923a31; font-weight:650; }
    .output { line-height:1.55; overflow-wrap:anywhere; }
    .output > :first-child { margin-top:0; }
    .output > :last-child { margin-bottom:0; }
    .output pre { overflow:auto; }
    .output table { display:block; overflow:auto; border-collapse:collapse; }
    .output th,.output td { border:1px solid #ddd; padding:6px; }
    @media(max-width:700px) { header{padding:4px 10px;min-height:40px;} .brandline{gap:5px;} .brand{font-size:18px;} .sub{font-size:11px;} .brand-divider{height:18px;} .header-links{gap:2px;} #helpButton{font-size:0;min-width:28px;padding:4px;} #helpButton::before{content:"?";font-size:14px;} main{margin:4px auto;padding:0 7px 20px;} .inside{padding:9px;} textarea{min-height:130px;max-height:28dvh;font-size:16px;} #catchInput{height:260px;max-height:none;} .dump-actions button{padding:4px;font-size:16px;} }
    @media(max-width:430px) { header{flex-wrap:wrap;} .header-links{width:100%;justify-content:flex-end;margin-top:-3px;} }
    @media(max-width:359px) { .dump-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));width:100%;} .dump-actions button{width:100%;} }
  </style>
</head>
<body>
<header>
  <div class="brandline"><div class="brand">BrainDumps</div><span class="brand-divider" aria-hidden="true"></span><div class="sub">Free your mind, one dump at a time.</div></div>
  <div class="header-links"><button id="helpButton" class="quiet" type="button" aria-label="Help">Help</button><a id="sheetLink" href="#" target="_blank" rel="noopener" hidden>Sheet</a></div>
</header>
<main>
  <div class="panel">
    <section id="catchPane" class="inside">
      <textarea id="catchInput" aria-label="Your thought or question" placeholder="What's on your mind? Start anywhere. Search your archive or share something new."></textarea>
      <div class="actions"><div class="row"><div class="clear-stack"><button id="clearCatch" type="button">Clear</button><span id="entryCount" class="entry-count" aria-live="polite" hidden></span></div><button id="micButton" type="button" hidden>Dictate</button></div><div class="dump-actions" aria-label="Response style"><button class="primary" data-dump-mode="neutral" type="button">Neutral</button><button class="primary" data-dump-mode="brainstorm" type="button">Brainstorm</button><button class="primary" data-dump-mode="coach" type="button">Coach</button></div></div>
      <div id="catchStatus" class="status" role="status"></div>
      <section id="catchResponse" class="item" aria-label="Catch response" hidden><h2>Response</h2><div id="catchResponseText" class="output"></div><div class="response-actions"><button id="saveResponse" type="button">Save response</button><span id="responseSaveStatus" class="response-save-status" role="status"></span></div></section>
    </section>
  </div>
</main>
<div id="helpPanel" class="panel" hidden style="position:fixed;top:52px;right:10px;max-width:330px;z-index:3;padding:14px;box-shadow:0 14px 40px #0002"><strong>BrainDumps</strong><p>Share a thought or ask a question, then choose Neutral, Brainstorm, or Coach for the response style. Every choice saves what you write and uses your archive. Clear actions you mention appear as to-dos in the response.</p><button id="closeHelp" type="button">Close</button></div>
<?!= includeMarkdownLibraries_(); ?>
<script>
  const $ = selector => document.querySelector(selector);
  const state = { busy:false, listening:false, currentEntryId:'' };
  function escapeHtml(value) { return String(value == null ? '' : value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function markdown(value) { const text=String(value||''); return window.marked && window.DOMPurify ? DOMPurify.sanitize(marked.parse(text,{gfm:true}),{USE_PROFILES:{html:true}}) : escapeHtml(text).replace(/\n/g,'<br>'); }
  function call(name,args,onSuccess,statusEl) {
    state.busy=true; if(statusEl) { statusEl.textContent='Working…'; statusEl.classList.remove('error'); }
    if (!window.google || !google.script || !google.script.run) { state.busy=false; if(statusEl) { statusEl.textContent='Open the deployed Apps Script web app to use this feature.'; statusEl.classList.add('error'); } return; }
    google.script.run.withSuccessHandler(result=>{state.busy=false; if(statusEl) statusEl.textContent=''; onSuccess(result);}).withFailureHandler(error=>{state.busy=false; if(statusEl) {statusEl.textContent=error.message||String(error); statusEl.classList.add('error');}})[name](...args);
  }
  $('#helpButton').onclick=()=>{$('#helpPanel').hidden=!$('#helpPanel').hidden;}; $('#closeHelp').onclick=()=>{$('#helpPanel').hidden=true;};
  $('#clearCatch').onclick=()=>{$('#catchInput').value=''; $('#catchInput').focus();};
  function renderEntryCount(value) {
    const count=Math.max(0,Number(value)||0), badge=$('#entryCount');
    badge.textContent=count+' '+(count===1?'entry':'entries');
    badge.className='entry-count tone-'+(Math.floor(count/10)%6);
    badge.hidden=false;
  }
  function submitDump(mode) {
    const text=$('#catchInput').value.trim(); if(text.length<3||state.busy||state.listening) return;
    call('saveBrainDump',[text,mode],result=>{ $('#catchInput').value=''; $('#catchInput').blur(); state.currentEntryId=result.entryId; renderEntryCount(result.entryCount); $('#catchStatus').textContent=result.warning ? result.warning : 'Saved · '+result.mode.charAt(0).toUpperCase()+result.mode.slice(1); $('#catchResponseText').innerHTML=markdown(result.responseMarkdown); $('#saveResponse').disabled=false; $('#saveResponse').textContent='Save response'; $('#responseSaveStatus').textContent=''; $('#responseSaveStatus').classList.remove('error'); $('#catchResponse').hidden=false; },$('#catchStatus'));
  }
  document.querySelectorAll('[data-dump-mode]').forEach(button=>button.onclick=()=>submitDump(button.dataset.dumpMode));
  $('#saveResponse').onclick=()=>{
    if(!state.currentEntryId||state.busy) return;
    call('saveResponse',[state.currentEntryId],()=>{ $('#saveResponse').disabled=true; $('#saveResponse').textContent='Saved'; $('#responseSaveStatus').textContent='Saved to your sheet.'; },$('#responseSaveStatus'));
  };
  const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(SpeechRecognition) {
    const mic=$('#micButton'); mic.hidden=false;
    mic.onclick=()=>{
      if(state.listening) return;
      const recognition=new SpeechRecognition(); recognition.lang=navigator.language||'en-US'; recognition.interimResults=false;
      recognition.onresult=event=>{$('#catchInput').value+=(($('#catchInput').value.trim())?' ':'')+event.results[0][0].transcript;};
      recognition.onerror=event=>{$('#catchStatus').textContent='Dictation did not finish: '+event.error;};
      recognition.onend=()=>{state.listening=false; mic.textContent='Dictate';};
      state.listening=true; mic.textContent='Listening…'; recognition.start();
    };
  }
  call('getAppConfig',[],config=>{
    $('#sheetLink').href=config.spreadsheetUrl; $('#sheetLink').hidden=false;
    renderEntryCount(config.entryCount);
    if(!config.openAIConfigured) {$('#catchStatus').textContent='OPENAI_API_KEY is not set. Thoughts will still save, but responses need the key.'; $('#catchStatus').classList.add('error');}
  },$('#catchStatus'));
</script>
</body>
</html>
